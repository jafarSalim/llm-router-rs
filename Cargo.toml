[package]
name = "llm-router"
version = "0.1.0"
edition = "2021"
description = "Local proxy that routes each Claude request to Haiku, Sonnet or Opus by difficulty and budget, with caching and cost logs"
license = "MIT"
repository = "https://github.com/jafarSalim/llm-router-rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"

[profile.release]
opt-level = 3
